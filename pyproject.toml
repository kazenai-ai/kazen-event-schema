[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazen-event-schema"
version = "0.6.6"
description = "The shared event contract for KazenAI: one KazenEvent model for the SDKs and Agent FinOps, including run receipts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Dhavan Shah", email = "founder@kazenai.com" }]
dependencies = ["pydantic>=2.0"]

[project.urls]
Homepage = "https://kazenai.com"
Documentation = "https://docs.kazenai.com/reference/events/"
Repository = "https://github.com/kazenai-ai/kazen-event-schema"
Changelog = "https://github.com/kazenai-ai/kazen-event-schema/releases"
"Bug Tracker" = "https://github.com/kazenai-ai/kazen-event-schema/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kazen_event_schema*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kazen_event_schema --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
fail_under = 80
