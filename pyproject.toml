[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazen-event-schema"
version = "0.6.0"
description = "Canonical KazenEvent schema for KazenAI services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "KazenAI", email = "hello@kazenai.com" }]
dependencies = ["pydantic>=2.0"]

[project.urls]
Homepage = "https://kazenai.com"
Repository = "https://github.com/kazenai/kazen-event-schema"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kazen_event_schema*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kazen_event_schema --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
fail_under = 80
