name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KAZENAI_TIER_MISMATCH_MULTIPLIER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Contact email guard (founder@kazenai.com only)
        run: |
          if git grep -nIE '[A-Za-z0-9._%+-]+@kazenai\.com' | grep -v 'founder@kazenai\.com'; then
            echo "Use founder@kazenai.com as the only public contact address."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=kazen_event_schema --cov-report=term-missing --cov-fail-under=80

  licence-gate:
    # Licence gate + CycloneDX SBOM (scripts/license_policy.py, licence-gate/license-policy.toml,
    # licence-gate/license-exceptions.toml). Blocking: a denied licence, an invalid SBOM or stale
    # generated notices fail the build. Actions are pinned by commit SHA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hash-locked licence tooling and Syft
        run: |
          python -m pip install --require-hashes -r scripts/license-tools.lock
          curl -sSfL -o /tmp/syft.tgz https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /tmp syft
      - name: Build wheel and sdist (the exact files that would be published)
        run: python -m build
      - name: SBOM and licence gate for the wheel and sdist
        run: |
          mkdir -p sbom unpacked
          for w in dist/*.whl; do python -m zipfile -e "$w" "unpacked/$(basename "$w" .whl)"; done
          /tmp/syft scan dir:unpacked -q -o syft-json=sbom/wheel.syft.json -o cyclonedx-json@1.5=sbom/wheel.cdx.json
          for s in dist/*.tar.gz; do /tmp/syft scan "file:$s" -q -o syft-json=sbom/sdist.syft.json -o cyclonedx-json@1.5=sbom/sdist.cdx.json; done
          python scripts/license_policy.py check --syft sbom/wheel.syft.json --syft sbom/sdist.syft.json --context library --report sbom/licence-report.json
          sha256sum dist/* | tee sbom/dist.sha256
      - name: Validate SBOMs (CycloneDX schema)
        run: python scripts/license_policy.py validate sbom/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
